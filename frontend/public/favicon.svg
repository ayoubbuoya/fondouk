<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondouk Favicon: The Caravanserai Horseshoe Arch & Golden Yield Coin -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1b2e" />
      <stop offset="100%" stop-color="#15121f" />
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e26a45" />
      <stop offset="100%" stop-color="#ba4626" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe18d" />
      <stop offset="50%" stop-color="#e8b45a" />
      <stop offset="100%" stop-color="#b88022" />
    </linearGradient>
  </defs>

  <!-- Night-Indigo Badge with Subdued Slate Border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#4a4263" stroke-width="2" opacity="0.6" />

  <!-- Desert Night Sky Stars -->
  <circle cx="13" cy="15" r="1.5" fill="#f3e9d2" opacity="0.85" />
  <circle cx="51" cy="15" r="1.5" fill="#f3e9d2" opacity="0.85" />

  <!-- Terracotta Archway Outer Solid -->
  <path
    d="M 14 54
       L 14 35
       C 10 30, 10 17, 32 10
       C 54 17, 54 30, 50 35
       L 50 54
       Z"
    fill="url(#archGrad)"
  />

  <!-- Gateway Portal Void (Doorway opening into the medina) -->
  <path
    d="M 23 54
       L 23 36
       C 20 32, 21 24, 32 18
       C 43 24, 44 32, 41 36
       L 41 54
       Z"
    fill="#0d0b16"
  />

  <!-- Brass Arch Trim along the inner curve -->
  <path
    d="M 23 49
       L 23 36
       C 20 32, 21 24, 32 18
       C 43 24, 44 32, 41 36
       L 41 49"
    fill="none"
    stroke="#e8b45a"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Keystone atop the Arch -->
  <polygon points="32,7.5 36.5,13.5 27.5,13.5" fill="#e8b45a" />

  <!-- Brass Plinths / Pillar Bases -->
  <rect x="11.5" y="50" width="8" height="4" rx="1" fill="#e8b45a" />
  <rect x="44.5" y="50" width="8" height="4" rx="1" fill="#e8b45a" />

  <!-- Golden Yield Coin Floating in Gateway Center -->
  <circle cx="32" cy="33" r="9" fill="url(#goldGrad)" />
  <circle cx="32" cy="33" r="7.5" fill="none" stroke="#fff0ba" stroke-width="1.2" opacity="0.9" />

  <!-- Yield 4-Point Star Motif on Coin -->
  <path
    d="M 32 26.5
       Q 32 33, 38.5 33
       Q 32 33, 32 39.5
       Q 32 33, 25.5 33
       Q 32 33, 32 26.5
       Z"
    fill="#2a1f0a"
  />
  <circle cx="32" cy="33" r="1.5" fill="#ffe18d" />
</svg>
